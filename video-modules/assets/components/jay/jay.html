        const fx = { bang: 0 };
        for (const key of FX_KEYS) fx[key] = 0;
        const gaze = { x: 0, y: 0, next: 0, typing: false };
        const blink = { next: 1.8, start: -1 };
        const keys = { press: [0, 0, 0], next: 0, bump: 0 };
        NSTEP = Math.ceil(DUR / STEP) + 2;
        track = new Float32Array(NSTEP * NF);
        let actIdx = 0;
        const glinted = new Set();

        for (let s = 0; s < NSTEP; s++) {
          const t = s * STEP, dt = STEP;
          const typingNow = inTyping(t);

          // gaze: at the camera with small saccades, or at the laptop while typing
          if (t >= gaze.next || typingNow !== gaze.typing) {
            gaze.typing = typingNow;
            gaze.x = typingNow ? rand(-8, -6) : rand(-1.6, 1.6);
            gaze.y = typingNow ? rand(6.5, 8) : rand(-0.8, 0.8);
            gaze.next = t + rand(0.9, 2.8);
          }
          T.typing = typingNow ? 1 : 0.08;
          T.happy = 0; T.wide = 0; T.blush = 0; T.think = 0; T.open = 0;
          T.browL = Math.sin(t * 0.9) * 1.2; T.browR = Math.sin(t * 0.9 + 1) * 1.2;
          T.ex = gaze.x; T.ey = gaze.y;
          T.turn = gaze.x / 8 * 0.3; T.pitch = gaze.y / 5 * 0.3;
          T.rot = Math.sin(t * 0.45) * 1.0 - gaze.x * 0.1 - (typingNow ? 0 : 1.2);
          T.hx = 0; T.hy = 0; T.fore = 0; T.hand = 0; T.armUp = 0; T.armSwing = 0; T.handSwing = 0; T.lid = 0; T.zoom = 0; T.grin = 0;
          // typing: head down toward the laptop, lids lowered, like the D glance
          if (typingNow) { T.pitch = 0.9; T.turn = -0.35; T.hy = 8; T.lid = 0.3; }
          fx.bang = 0;
          for (const key of FX_KEYS) fx[key] = 0;

          for (const [g0, gd, where] of GLANCES) {
            if (t >= g0 && t < g0 + gd) {
              const L = LOOK[where];
              T.ex = L.ex; T.ey = L.ey; T.turn = L.turn; T.pitch = L.pitch;
              T.rot += L.rot || 0; T.hx += L.hx || 0; T.hy += L.hy || 0;
              T.lid = Math.max(T.lid, L.lid || 0); T.browL += L.brow || 0; T.browR += L.brow || 0;
            }
          }

          // blink
          if (blink.start < 0 && t > blink.next) blink.start = t;
          let bv = 0;
          if (blink.start >= 0) {
            const k = (t - blink.start) / 0.17;
            if (k >= 1) {
              blink.start = -1;
              blink.next = t + (rng() < 0.2 ? 0.14 : rand(2.2, 5.2));
            } else bv = k < 0.45 ? 1 : 0;
          }
          T.blinkL = T.blinkR = bv;

          // keyed action
          while (actIdx < ACTS.length && t >= ACTS[actIdx][0] + ACTS[actIdx][2] / 1000) actIdx++;
          const A = ACTS[actIdx];
          if (A && t >= A[0]) {
            const k = (t - A[0]) / (A[2] / 1000);
            ACTION_FNS[A[1]](k, T, t, fx);
            const ga = GLINT_AT[A[1]];
            if (ga !== undefined && k >= ga && !glinted.has(actIdx)) { glinted.add(actIdx); glintEvents.push(t); }
          }

          // talking, from the narration loudness
          const amp = envAt(t);
          if (amp > 0.02) {
            T.open = Math.max(T.open, amp * 0.72);
            T.browL += amp * 3; T.browR += amp * 4;
            T.hy -= amp * 3;
          }

          for (const key of PKEYS) {
            const rate = RATE[key] || RATE.default;
            P[key] += (T[key] - P[key]) * (1 - Math.exp(-dt * rate));
          }

          // keys under the fingers
          if (P.typing > 0.5 && t >= keys.next) {
            const i = rng() < 0.45 ? 0 : rng() < 0.6 ? 1 : 2;
            keys.press[i] = 1;
            keys.bump = 1;
            keys.next = t + rand(0.07, 0.17);
          }
          for (let i = 0; i < 3; i++) keys.press[i] = Math.max(0, keys.press[i] - dt * 7);
          keys.bump = Math.max(0, keys.bump - dt * 5);

          const o = s * NF;
          for (let i = 0; i < PKEYS.length; i++) track[o + i] = P[PKEYS[i]];
          const x = o + PKEYS.length;
          track[x] = keys.press[0]; track[x + 1] = keys.press[1]; track[x + 2] = keys.press[2];
          track[x + 3] = keys.bump; track[x + 4] = fx.bang; track[x + 5] = T.rot;
          FX_KEYS.forEach((key, i) => { track[x + 6 + i] = fx[key]; });
        }
      }

      // pose at time t, interpolated between recorded steps
      const S = {};
      function sample(t) {
        const f = clamp(t / STEP, 0, NSTEP - 1.001);
        const i = Math.floor(f), w = f - i;
        const a = i * NF, b = (i + 1) * NF;
        for (let k = 0; k < PKEYS.length; k++) S[PKEYS[k]] = mix(track[a + k], track[b + k], w);
        for (let k = 0; k < XKEYS.length; k++) S[XKEYS[k]] = mix(track[a + PKEYS.length + k], track[b + PKEYS.length + k], w);
        return S;
      }

      // ================================================================
      // Deformers and render
      // ================================================================
      let P = null, breath = 0, hairSway = 0, tapAmt = [0, 0, 0], foreAngle = 0, handAngle = 0;
      const bodyDeform = (x, y) => [x, 1910 + (y - 1910) * (1 + breath * 0.005)];
      function headDeform(x, y) {
        const nx = (x - 1050) / 330, ny = (y - 650) / 360;
        const wf = 1 - smooth(0.3, 1, Math.sqrt(nx * nx + ny * ny));
        const ex = (x - 1405) / 80, ey = (y - 640) / 120;
        const we = Math.max(0, 1 - (ex * ex + ey * ey));
        const hs = clamp((380 - y) / 330, 0, 1);
        x += P.turn * (24 * wf - 10 * we) + hairSway * 12 * hs * hs;
        y += P.pitch * 15 * wf;
        if (P.grin > 0.001) {
          for (const [cx, cy, dir] of CORNERS) {
            const dx = x - cx, dy = y - cy;
            const g = Math.exp(-(dx * dx + dy * dy) / (2 * GRIN_R * GRIN_R)) * P.grin;
            y -= GRIN_UP * g; x += dir * GRIN_OUT * g;
          }
        }
        // lean / startle: the head comes closer (zoom > 0) or pulls back (zoom < 0), anchored at the chin
        const z = 1 + 0.06 * P.zoom;
        x = 1100 + (x - 1100) * z; y = 980 + (y - 980) * z;
        const p = rotate(x, y, 1180, 960, P.rot);
        return [p[0] + P.hx, p[1] + P.hy - breath * 4.75];
      }
      function eyeDeform(e, open, gx, gy) {
        return (x, y) => {
          const nx = (x - e.cx) / e.rx, ny = (y - e.cy) / e.ry;
          const f = 1 - smooth(0.25, 1.05, Math.sqrt(nx * nx + ny * ny));
          x += gx * f; y += gy * f;
          return headDeform(x, e.yb + (y - e.yb) * open);
        };
      }
      const mouthDrop = (x) => P.open * MOUTH_DEPTH * mouthProfile(x);
      function armDeform(x, y) {
        for (let i = 0; i < 3; i++) {
          if (!tapAmt[i]) continue;
          const dx = x - FINGERS[i][0], dy = y - FINGERS[i][1];
          const g = Math.exp(-(dx * dx + dy * dy) / (2 * 38 * 38)) * tapAmt[i];
          x -= 2 * g; y += 7 * g;
        }
        const wh = smooth(1380, 1270, x);
        if (wh > 0) {
          const h = rotate(x, y, WRIST[0], WRIST[1], handAngle);
          x = mix(x, h[0], wh); y = mix(y, h[1], wh);
        }
        return rotate(x, y, ELBOW[0], ELBOW[1], foreAngle);
      }
      // waving arm: hand turns at the wrist, forearm at the elbow, then the whole arm slides by its drop
      function armRDeform(x, y) {
        const wh = smooth(1095, 1005, y);
        if (wh > 0) {
          const h = rotate(x, y, WRIST_R[0], WRIST_R[1], P.handSwing);
          x = mix(x, h[0], wh); y = mix(y, h[1], wh);
        }
        const p = rotate(x, y, ELBOW_R[0], ELBOW_R[1], P.armSwing + (1 - P.armUp) * 10);
        return [p[0], p[1] + (1 - P.armUp) * ARM_DROP];
      }
      const still = (x, y) => [x, y];

      let gfx = null;
      function setupScene(layers) {
        const r = createRenderer($("jay-gl"));
        const tex = (c, rect) => r.texture(c, rect);
        const T_ = {
          body: tex(layers.body, { x: 0, y: 0, w: 2048, h: 2048 }),
          head: tex(layers.head, R.head),
          eyeL: tex(layers.eyeL, R.eyeL), eyeR: tex(layers.eyeR, R.eyeR),
          browL: tex(layers.browL, R.browL), browR: tex(layers.browR, R.browR),
          mouth: tex(layers.mouth, R.mouth),
          inside: tex(layers.inside, { x: MOUTH_L, y: 0, w: MOUTH_R - MOUTH_L, h: 1 }),
          happyL: tex(layers.happyL, R.happy), happyR: tex(layers.happyR, R.happy),
          blushL: tex(layers.blush, { x: 827, y: 712, w: 116, h: 52 }),
          blushR: tex(layers.blush, { x: 1144, y: 692, w: 104, h: 48 }),
          lens: tex(layers.lens, R.lens),
          arm: tex(layers.arm, R.arm),
          armR: tex(layers.armR, R.armR),
          front: tex(layers.front, R.front),
        };
        const m = (t, nx, ny, rect) => r.mesh(t, rect || t, nx, ny);
        return {
          r,
          body: m(T_.body, 4, 4),
          head: m(T_.head, 36, 40),
          blushL: m(T_.blushL, 1, 1), blushR: m(T_.blushR, 1, 1),
          eyeL: m(T_.eyeL, 14, 6), eyeR: m(T_.eyeR, 14, 6),
          inside: m(T_.inside, 24, 2),
          mouth: m(T_.mouth, 24, 4),
          browL: m(T_.browL, 4, 2), browR: m(T_.browR, 4, 2),
          happyL: m(T_.happyL, 8, 2), happyR: m(T_.happyR, 8, 2),
          lens: m(T_.lens, 6, 2),
          arm: m(T_.arm, 40, 10),
          armR: m(T_.armR, 10, 18),
          front: m(T_.front, 1, 1),
        };
      }

      const steamPaths = [...$("jay-steam").children];
      const waveLines = $("jay-wavelines");
      const thought = $("jay-thought"), thoughtText = $("jay-thought-text"), bang = $("jay-bang");
      const BANG_SCALE = 2 * FX;
      // where the "!" sits (stage units, 2048 = stage width): up and to the right, clear of the hair; drawn around (1580, 220)
      const BANG_AT = [1710, 160];
      const qmark = $("jay-qmark"), bulb = $("jay-bulb"), bulbRays = $("jay-bulb-rays");

      function renderAt(t) {
        t = clamp(t, 0, DUR);
        P = sample(t);
        const { r } = gfx;
        breath = Math.sin(t * Math.PI * 2 / 4.2);
        hairSway = Math.sin(t * 1.25) * 0.5 + (P.trot - P.rot) * 0.6 - P.turn * 0.4;
        const ty = P.typing;
        tapAmt = [P.press0, P.press1, P.press2].map((p) => Math.sin(p * Math.PI) * ty);
        foreAngle = P.fore + ty * (Math.sin(t * 1.7) * 0.25 + P.bump * 0.35);
        handAngle = P.hand + ty * Math.sin(t * 2.3) * 0.5;

        r.begin();
        r.draw(gfx.body, bodyDeform);
        r.draw(gfx.head, headDeform);
        r.draw(gfx.blushL, headDeform, P.blush * 0.55);
        r.draw(gfx.blushR, headDeform, P.blush * 0.55);
        const openL = clamp((1 - Math.max(P.blinkL, P.happy, P.lid)) * (1 + P.wide * 0.14), 0.06, 1.2);
        const openR = clamp((1 - Math.max(P.blinkR, P.happy, P.lid)) * (1 + P.wide * 0.14), 0.06, 1.2);
        r.draw(gfx.eyeL, eyeDeform(EYE.L, openL, P.ex, P.ey), 1 - P.happy);
        r.draw(gfx.eyeR, eyeDeform(EYE.R, openR, P.ex, P.ey), 1 - P.happy);
        r.draw(gfx.happyL, headDeform, P.happy);
        r.draw(gfx.happyR, headDeform, P.happy);
        r.draw(gfx.inside, (x, v) => {
          const top = lipY(x) + 4;
          return headDeform(x, top + v * (6 + mouthDrop(x)));
        }, smooth(0, 0.06, P.open));
        r.draw(gfx.mouth, (x, y) => headDeform(x, y + mouthDrop(x)));
        const browDip = Math.max(P.blinkL, P.blinkR) * 2;
        r.draw(gfx.browL, (x, y) => headDeform(x, y - P.browL + browDip));
        r.draw(gfx.browR, (x, y) => headDeform(x, y - P.browR + browDip));
        let gk = -1;
        for (const g of glintEvents) if (t >= g && t <= g + 0.48) gk = (t - g) / 0.48;
        if (gk >= 0) r.draw(gfx.lens, headDeform, 1, [-0.3 + gk * 1.9, 0.07, 0.75]);
        r.draw(gfx.arm, armDeform);
        if (P.armUp > 0.002) r.draw(gfx.armR, armRDeform, 1, null, LID_BOTTOM);
        r.draw(gfx.front, still);
        r.finish();

        steamPaths.forEach((p, i) => {
          const k = (t * 0.32 + i / 3) % 1;
          p.setAttribute("transform", `translate(${(Math.sin(t * 1.5 + i * 2) * 7).toFixed(1)} ${(-k * 70).toFixed(1)})`);
          p.setAttribute("opacity", (Math.sin(k * Math.PI) * 0.6).toFixed(3));
        });
        let thoughtLine = "";
        for (const [t0, s] of THOUGHTS) if (t >= t0 - 0.5) thoughtLine = s;
        if (thoughtText.textContent !== thoughtLine) thoughtText.textContent = thoughtLine;
        thought.setAttribute("opacity", clamp(P.think * 1.15, 0, 1).toFixed(3));
        thought.setAttribute("transform", `translate(0 ${(Math.sin(t * 2) * 6 + (1 - P.think) * 20).toFixed(1)})`);
        bang.setAttribute("opacity", clamp(P.bang, 0, 1).toFixed(3));
        bang.setAttribute("transform", `translate(${BANG_AT[0]} ${BANG_AT[1]}) scale(${(Math.max(0.01, P.bang) * BANG_SCALE).toFixed(3)}) translate(-1580 -220)`);

        // "?" and the bulb take the "!" spot; the "?" rocks a little, the bulb's rays flicker
        qmark.setAttribute("opacity", clamp(P.qm, 0, 1).toFixed(3));
        qmark.setAttribute("transform", `translate(${BANG_AT[0]} ${BANG_AT[1]}) scale(${(Math.max(0.01, P.qm) * BANG_SCALE).toFixed(3)}) rotate(${(Math.sin(t * 3) * 6).toFixed(1)}) translate(-1580 -220)`);
        bulb.setAttribute("opacity", clamp(P.bulb, 0, 1).toFixed(3));
        bulb.setAttribute("transform", `translate(${BANG_AT[0]} ${BANG_AT[1]}) scale(${(Math.max(0.01, P.bulb) * BANG_SCALE).toFixed(3)}) translate(-1580 -220)`);
        bulbRays.setAttribute("opacity", (0.55 + 0.45 * Math.abs(Math.sin(t * 9))).toFixed(3));

        // motion lines ride with the hand while it waves
        const lines = clamp(Math.abs(P.armSwing) / 4, 0, 1) * smooth(0.85, 1, P.armUp);
        waveLines.setAttribute("opacity", lines.toFixed(3));
        waveLines.setAttribute("transform",
          `translate(0 ${((1 - P.armUp) * ARM_DROP).toFixed(1)}) rotate(${(P.armSwing + (1 - P.armUp) * 10).toFixed(2)} ${ELBOW_R[0]} ${ELBOW_R[1]}) rotate(${P.handSwing.toFixed(2)} ${WRIST_R[0]} ${WRIST_R[1]})`);
      }

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      let lastT = 0;
      const ready = (async () => {
        loadScript();
        const layers = await buildLayers();
        gfx = setupScene(layers);
        simulate();
        renderAt(lastT);
      })();
      window.__hf.buildReady.jay = ready;
      ready.catch((err) => console.error("jay build failed", err));

      window.addEventListener("hf-seek", (e) => {
        lastT = e.detail.time;
        if (gfx) renderAt(lastT);
        else e.detail.waitUntil(ready.then(() => renderAt(lastT)));
      });

      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, num(host && host.getAttribute("data-duration"), 60));
      window.__timelines["jay"] = tl;
    })();
  </script>
</template>
