<template>

    Tile wipe — a transition between scenes (docs: transitions/tile-wipe/tile-wipe.md). Square tiles light up outward from a point,

    No content of its own: cuts and cards are passed in; colours and font come from the design theme's tokens
    (--c-tile0…4, --c-card, --c-border, --c-ink, --c-ink2, --c-focus, --c-positive, --font-sans).
    This file is static markup + styles only. Initialisation lives in the sibling tile-wipe.mjs
    (explicit init per modules/modules.md); the video project wires it into its own host/adapter.
  -->
  <style>
    #root {
      position: absolute;
      inset: 0;
      font-family: var(--font-sans);
      color: var(--c-ink);
      pointer-events: none;
    }
    /* the page behind the tiles, so the gaps never show the cut */
    #tw-plate { position: absolute; left: 0; width: 100%; background: var(--c-card); }
    #tw-tiles { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    #tw-tiles i { position: absolute; width: 48px; height: 48px; border-radius: 9px; opacity: 0; }

    #root .tw-card {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 40px;
      padding: 34px 52px 38px 44px;
      background: var(--c-card);
      border: 2px solid var(--c-border);
      border-radius: 16px;
      white-space: nowrap;
      opacity: 0;
    }
    #root .tw-card .lb { font-size: 150px; font-weight: 700; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
    #root .tw-card .col { padding-left: 40px; border-left: 2px solid var(--c-border); }
    #root .tw-card .ti { font-size: 48px; font-weight: 400; color: var(--c-focus); }
    #root .tw-card .ti b { font-weight: 700; }
    #root .tw-card .meta { display: flex; align-items: center; gap: 28px; margin-top: 16px; font-size: 28px; color: var(--c-ink2); }
    #root .tw-card .meta i { display: inline-block; width: 18px; height: 18px; border-radius: 50%; margin-right: 10px; vertical-align: -1px; }
    #root .tw-card .meta b { margin-right: 8px; font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--c-positive); }

  <div id="root" data-composition-id="tile-wipe" data-width="1920" data-height="1080">

  </div>
