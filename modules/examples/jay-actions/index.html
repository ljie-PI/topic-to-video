<!doctype html>
<!--
  Jay action demo: every action of the jay component once, in order, its name on the label bar at the top.
  design     designs/github/github.md   theme tokens and ground below; fonts from assets/fonts (downloaded)
  components components/jay (840 px, centred), caption-bar (moved to the top as a label bar)
  data       data/video-data.js         built by tools/build-data.mjs
-->
<html lang="zh-CN" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="data/video-data.js"></script>
    <link rel="stylesheet" href="assets/fonts/rose-pine-github-fonts.css" />
    <style>
      /* designs/github/github.md — theme tokens (paper) */
      :root {
        --c-canvas: #f2f4f6;
        --c-card: #fbfcfd;
        --c-surface: #f3f5f7;
        --c-border: #d3d9df;
        --c-ink: #22272e;
        --c-ink2: #57606a;
        --c-muted: #818a94;
        --c-focus: #2f6aa8;
        --c-focus-tint: #e6eef7;
        --c-positive: #337a4c;
        --c-positive-solid: #3d8757;
        --c-positive-tint: #e4f0e8;
        --c-positive-text: #24563a;
        --c-highlight: #c9a645;
        --c-done: #6f5bb5;
        --c-chrome: #262b31;
        --c-chrome-ink: #f6f8fa;
        --c-chrome-muted: #9aa3ad;
        --c-chrome-active: #e08a73;
        --c-tile0: #e4e8ec;
        --c-tile1: #c9d6e3;
        --c-tile2: #9db4cc;
        --c-tile3: #6f92b5;
        --c-tile4: #2f6aa8;
        --ground: url("assets/textures/paper.jpg") 0 0 / 1920px 1080px, #f2f4f6;
        --font-sans: "Noto Sans", "Noto Sans SC", sans-serif;
        --font-mono: "Noto Sans Mono", "Noto Sans SC", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--c-canvas);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: var(--font-sans);
        color: var(--c-ink);
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-rgwh" id="root" data-composition-id="main" data-start="0" data-duration="59.9" data-width="1920" data-height="1080">
      <div data-hf-id="hf-yd2p" id="ground" data-layout-ignore></div>

      <!-- the action's name, on a label bar at the top -->
      <div data-hf-id="hf-pxlr"
        id="caption-bar"
        data-composition-id="caption-bar"
        data-composition-src="compositions/caption-bar.html"
        data-start="0"
        data-duration="59.9"
        data-track-index="6"
        data-track-kind="captions"
        data-width="1920"
        data-height="1080"
        data-variable-values='{"x":96,"y":0,"width":1728,"height":88,"fontSize":40}'
        style="z-index: 16"
      ></div>

      <!-- Jay at 840 px, centred, laptop base near the bottom edge -->
      <div data-hf-id="hf-5zmb"
        id="jay"
        data-composition-id="jay"
        data-composition-src="compositions/jay.html"
        data-start="0"
        data-duration="59.9"
        data-track-index="9"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        data-variable-values='{"x":540,"y":260,"size":840}'
        style="z-index: 20"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
