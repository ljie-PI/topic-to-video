<template>
  <!--
    Nav bar — the top chrome of the presenter layout (docs: components/nav-bar/nav-bar.md).
    No content of its own: logo, path and tabs are passed in when the video is assembled; colours and font come from the
    design theme's tokens (--c-chrome, --c-chrome-ink, --c-chrome-muted, --c-chrome-active, --font-sans).
    Mount once, full length: data-composition-id="nav-bar", data-start="0".
    Host variables: logo (image path), path ("a / b": the last segment is the page), tabsX (px), data (key in window.VIDEO, default "tabs").
    Data: window.VIDEO.tabs = [{ label, at }]; "at" is video seconds.
  -->
  <style>
    #root {
      position: absolute;
      inset: 0;
      font-family: var(--font-sans);
      pointer-events: none;
    }
    #nb-bar {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 72px;
      background: var(--c-chrome);
    }
    #nb-logo { position: absolute; left: 40px; top: 16px; width: 40px; height: 40px; object-fit: contain; }
    #nb-path {
      position: absolute;
      left: 98px;
      top: 0;
      line-height: 72px;
      font-size: 26px;
      font-weight: 600;
      color: var(--c-chrome-ink);
      white-space: nowrap;
    }
    #nb-path em { font-style: normal; font-weight: 400; color: var(--c-chrome-muted); }
    #nb-tabs { position: absolute; left: 420px; top: 0; height: 72px; display: flex; }
    /* each tab holds its label twice, idle and current, and crossfades between them */
    #nb-tabs .tab {
      display: grid;
      height: 72px;
      line-height: 72px;
      text-align: center;
      font-size: 28px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    #nb-tabs .tab span { grid-area: 1 / 1; }
    #nb-tabs .tab .idle { color: var(--c-chrome-muted); }
    #nb-tabs .tab .now { color: var(--c-chrome-ink); opacity: 0; }
    #nb-line {
      position: absolute;
      left: 420px;
      top: 66px;
      width: 100px;
      height: 6px;
      border-radius: 3px 3px 0 0;
      background: var(--c-chrome-active);
      transform-origin: 0 0;
    }
  </style>
  <div id="root" data-composition-id="nav-bar" data-width="1920" data-height="1080">
    <div id="nb-bar">
      <img id="nb-logo" alt="" />
      <div id="nb-path"></div>
      <div id="nb-tabs"></div>
      <div id="nb-line"></div>
    </div>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const V = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const $ = (id) => document.getElementById(id);

      // logo: an image passed in; without one the path moves to the left edge
      const logo = $("nb-logo");
      if (V.logo) logo.src = V.logo;
      else {
        logo.remove();
        $("nb-path").style.left = "40px";
      }

      // path: the last "/" segment is the page, the rest is muted
      const path = V.path != null ? String(V.path) : "";
      const cut = path.lastIndexOf("/");
      const box = $("nb-path");
      if (cut >= 0) {
        const em = document.createElement("em");
        em.textContent = path.slice(0, cut + 1);
        box.append(em, " " + path.slice(cut + 1).trim());
      } else box.textContent = path;

      // tabs: fixed widths from the label so the underline lands the same in every render
      const tabs = ((window.VIDEO && window.VIDEO[V.data || "tabs"]) || []).slice().sort((a, b) => a.at - b.at);
      const left = Number(V.tabsX) || 420;
      const row = $("nb-tabs"), line = $("nb-line");
      row.style.left = left + "px";
      const widthOf = (s) => Math.max(80, Math.round([...String(s)].reduce((w, ch) => w + (/[⺀-鿿＀-￯]/.test(ch) ? 28 : 17.5), 0)) + 44);
      const X = [], W = [];
      let x = 0;
      tabs.forEach((t, i) => {
        const el = document.createElement("div");
        el.className = "tab";
        el.id = `nb-t${i}`;
        el.style.width = (W[i] = widthOf(t.label)) + "px";
        for (const cls of ["idle", "now"]) {
          const s = document.createElement("span");
          s.className = cls;
          s.textContent = t.label;
          // the first tab starts as the current one
          if (i === 0) s.style.opacity = cls === "now" ? "1" : "0";
          el.appendChild(s);
        }
        X[i] = x; x += W[i];
        row.appendChild(el);
      });

      if (tabs.length) {
        line.style.left = left + "px";
        line.style.width = W[0] + "px";
        // the underline is the film's progress bar: it moves while the transition covers the cut
        tabs.forEach((t, i) => {
          if (i === 0) return;
          const at = Math.max(0, t.at - 0.04);
          tl.to("#nb-line", { x: X[i], scaleX: W[i] / W[0], duration: 0.32, ease: "power3.inOut" }, Math.max(0, t.at - 0.1));
          tl.to(`#nb-t${i - 1} .now`, { opacity: 0, duration: 0.2 }, at);
          tl.to(`#nb-t${i - 1} .idle`, { opacity: 1, duration: 0.2 }, at);
          tl.to(`#nb-t${i} .now`, { opacity: 1, duration: 0.2 }, at);
          tl.to(`#nb-t${i} .idle`, { opacity: 0, duration: 0.2 }, at);
        });
      } else {
        line.remove();
      }

      window.__timelines["nav-bar"] = tl;
    })();
  </script>
</template>
