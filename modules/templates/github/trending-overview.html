<template>
  <!--
    Template: github/trending-overview — a Trending list walked through one repo at a time (docs: templates/github/trending-overview.md).
    Layout: presenter (layouts/presenter.md). Header line = page title; main area = README screenshot of the repo being named,
    scrolling slowly; secondary area = the Trending list, the named row highlighted.
    Mount: data-composition-id="trending-overview", data-start = scene start, data-duration = scene length.
    Host variables: title, date, range, listAt (s), scrollSpeed (px/s), data (key in window.VIDEO, default "trending").
    Data: window.VIDEO.trending = { repos: [{ rank, owner, repo, desc, stars, readme, cue }] } — up to 5 repos; cue is scene seconds.
  -->
  <style>
    #root {
      position: absolute;
      inset: 0;
      font-family: var(--font-sans);
      color: var(--c-ink);
    }
    #root .abs { position: absolute; }
    #root svg.ico { flex: none; fill: currentColor; }

    /* header line: x 96, y 100–172 */
    #to-title { left: 96px; top: 100px; height: 72px; display: flex; align-items: center; gap: 32px; white-space: nowrap; }
    #to-title h1 { font-size: 56px; font-weight: 700; letter-spacing: -0.01em; }
    #to-title span { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--c-ink2); }

    /* secondary area: x 1184–1824, y 100–622 */
    #to-list {
      left: 1184px;
      top: 100px;
      width: 640px;
      background: var(--c-card);
      border: 2px solid var(--c-border);
      border-radius: 12px;
      overflow: hidden;
    }
    #to-list .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 16px;
      background: var(--c-surface);
      border-bottom: 2px solid var(--c-border);
      font-size: 24px;
      font-weight: 600;
      white-space: nowrap;
    }
    #to-list .seg { display: flex; height: 38px; border: 2px solid var(--c-border); border-radius: 8px; overflow: hidden; }
    #to-list .seg span { padding: 0 16px; line-height: 34px; color: var(--c-ink2); }
    #to-list .seg span.on { background: var(--c-card); color: var(--c-ink); border-right: 2px solid var(--c-border); }
    #to-list .drop { display: flex; align-items: center; gap: 8px; color: var(--c-ink2); }
    #to-list .drop b { color: var(--c-ink); font-weight: 600; }
    #to-list .drop svg { width: 20px; height: 20px; }
    #to-list .row { position: relative; height: 92px; border-top: 2px solid var(--c-border); }
    #to-list .row:nth-child(2) { border-top: 0; }
    #to-list .tint { position: absolute; inset: 0; background: var(--c-focus-tint); opacity: 0; }
    #to-list .bar { position: absolute; left: 0; top: 0; width: 6px; height: 100%; background: var(--c-focus); }
    #to-list .rk {
      position: absolute;
      left: 0;
      top: 0;
      width: 64px;
      line-height: 90px;
      text-align: center;
      font-size: 34px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--c-muted);
    }
    #to-list .body { position: absolute; left: 64px; right: 20px; top: 8px; }
    #to-list .path { display: block; height: 40px; line-height: 40px; font-size: 28px; font-weight: 400; color: var(--c-focus); white-space: nowrap; }
    #to-list .path b { font-weight: 700; }
    #to-list .desc { display: block; margin-top: 2px; line-height: 34px; font-size: 26px; font-weight: 500; color: var(--c-ink2); white-space: nowrap; }
    #to-list .wk {
      position: absolute;
      right: 20px;
      bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--c-positive);
      white-space: nowrap;
      transform-origin: 100% 50%;
    }
    #to-list .wk .ic { position: relative; width: 24px; height: 24px; flex: none; }
    #to-list .wk .ic svg { position: absolute; left: 0; top: 0; width: 24px; height: 24px; }
    #to-list .wk .s1 { fill: var(--c-highlight); opacity: 0; }
    #to-list .wk b { font-variant-numeric: tabular-nums; font-size: 28px; font-weight: 700; line-height: 34px; }

    /* main area: x 96–1144, y 196–984 */
    #to-readme {
      left: 96px;
      top: 196px;
      width: 1048px;
      height: 788px;
      background: var(--c-card);
      border: 2px solid var(--c-border);
      border-radius: 12px;
      overflow: hidden;
    }
    #to-readme .rbar {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 60px;
      padding: 0 20px;
      background: var(--c-surface);
      border-bottom: 2px solid var(--c-border);
      font-family: var(--font-mono);
      font-size: 26px;
      font-weight: 600;
      white-space: nowrap;
    }
    #to-readme .rbar svg { width: 26px; height: 26px; fill: var(--c-ink2); }
    #to-readme .rp { position: absolute; right: 20px; top: 0; line-height: 60px; font-family: var(--font-sans); font-size: 26px; font-weight: 500; color: var(--c-ink2); opacity: 0; }
    #to-readme .view { position: relative; height: 722px; overflow: hidden; background: var(--c-card); }
    #to-readme .view img { position: absolute; left: 0; top: 0; width: 100%; height: auto; opacity: 0; }
  </style>
  <div id="root" data-composition-id="trending-overview" data-width="1920" data-height="1080">
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <path id="to-ico-star" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Zm0 2.445L6.615 5.5a.75.75 0 0 1-.564.41l-3.097.45 2.24 2.184a.75.75 0 0 1 .216.664l-.528 3.084 2.769-1.456a.75.75 0 0 1 .698 0l2.77 1.456-.53-3.084a.75.75 0 0 1 .216-.664l2.24-2.183-3.096-.45a.75.75 0 0 1-.564-.41L8 2.694Z" />
        <path id="to-ico-starfill" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z" />
        <path id="to-ico-book" d="M0 1.75A.75.75 0 0 1 .75 1h4.253c1.227 0 2.317.59 3 1.501A3.743 3.743 0 0 1 11.006 1h4.245a.75.75 0 0 1 .75.75v10.5a.75.75 0 0 1-.75.75h-4.507a2.25 2.25 0 0 0-1.591.659l-.622.621a.75.75 0 0 1-1.06 0l-.622-.621A2.25 2.25 0 0 0 5.258 13H.75a.75.75 0 0 1-.75-.75Zm7.251 10.324.004-5.073-.002-2.253A2.25 2.25 0 0 0 5.003 2.5H1.5v9h3.757a3.75 3.75 0 0 1 1.994.574ZM8.755 4.75l-.004 7.322a3.752 3.752 0 0 1 1.992-.572H14.5v-9h-3.495a2.25 2.25 0 0 0-2.25 2.25Z" />
        <path id="to-ico-down" d="m4.427 7.427 3.396 3.396a.25.25 0 0 0 .354 0l3.396-3.396A.25.25 0 0 0 11.396 7H4.604a.25.25 0 0 0-.177.427Z" />
      </defs>
    </svg>

    <div id="to-title" class="abs"><h1 id="to-h1"></h1><span id="to-date"></span></div>
    <div id="to-list" class="abs">
      <div class="head">
        <div class="seg"><span class="on">仓库</span><span>开发者</span></div>
        <div class="drop">日期范围：<b id="to-range"></b><svg class="ico" viewBox="0 0 16 16"><use href="#to-ico-down" /></svg></div>
      </div>
    </div>
    <div id="to-readme" class="abs">
      <div class="rbar" id="to-rbar"><svg class="ico" viewBox="0 0 16 16"><use href="#to-ico-book" /></svg>README.md</div>
      <div class="view" id="to-view"></div>
    </div>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const V = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const C = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
      const num = (v, d) => (v !== "" && v != null && Number.isFinite(Number(v)) ? Number(v) : d);
      const $ = (id) => document.getElementById(id);
      const FOCUS = C("--c-focus"), MUTED = C("--c-muted"), BORDER = C("--c-border");
      const D = (window.VIDEO && window.VIDEO[V.data || "trending"]) || {};
      const repos = (Array.isArray(D) ? D : D.repos || []).slice(0, 5);
      const LIST_AT = num(V.listAt, 0.2), SPEED = num(V.scrollSpeed, 60), VIEW_W = 1044, VIEW_H = 722;

      $("to-h1").textContent = V.title || D.title || "GitHub 本周热榜";
      $("to-date").textContent = V.date || D.date || "";
      $("to-range").textContent = V.range || D.range || "本周";

      // rows and README screenshots, one per repo
      const list = $("to-list"), view = $("to-view"), rbar = $("to-rbar");
      repos.forEach((r, i) => {
        const n = i + 1;
        const row = document.createElement("div");
        row.className = "row";
        row.id = `to-row${n}`;
        row.innerHTML = `<div class="tint"></div><div class="bar"></div><div class="rk"></div>
          <div class="body"><span class="path"></span><span class="desc"></span></div>
          <div class="wk"><span class="ic"><svg class="ico s0" viewBox="0 0 16 16"><use href="#to-ico-star" /></svg><svg class="ico s1" viewBox="0 0 16 16"><use href="#to-ico-starfill" /></svg></span><b></b></div>`;
        row.querySelector(".rk").textContent = r.rank != null ? r.rank : n;
        const path = row.querySelector(".path");
        path.append(`${r.owner} / `);
        const b = document.createElement("b");
        b.textContent = r.repo;
        path.append(b);
        // a long path steps down from 28px so it stays inside the row
        if ((`${r.owner} / ${r.repo}`).length > 32) path.style.fontSize = "26px";
        row.querySelector(".desc").textContent = r.desc || "";
        row.querySelector(".wk b").textContent = r.stars || "";
        list.appendChild(row);

        const label = document.createElement("span");
        label.className = "rp";
        label.id = `to-rp${n}`;
        label.textContent = `${r.owner}/${r.repo}`;
        rbar.appendChild(label);

        const img = document.createElement("img");
        img.id = `to-img${n}`;
        img.alt = `${r.repo} README`;
        if (r.readme) img.src = r.readme;
        view.appendChild(img);
      });

      // entrance: title, then the list loads like a feed, then the README panel
      tl.fromTo("#to-title", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, Math.max(0, LIST_AT - 0.2));
      tl.fromTo("#to-list", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, LIST_AT);
      tl.fromTo("#to-list .row", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.1 }, LIST_AT + 0.05);
      tl.fromTo("#to-readme", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, LIST_AT + 0.1);
      tl.set("#to-list .bar", { scaleY: 0 }, 0);
      if (repos.length) tl.set("#to-img1", { opacity: 1 }, 0);

      // each repo takes focus as it is named: row highlighted, README swapped and scrolled, then starred
      repos.forEach((r, i) => {
        const n = i + 1, row = `#to-row${n}`;
        const c = num(r.cue, LIST_AT + 0.8 + i * 3);
        const next = repos[i + 1] ? num(repos[i + 1].cue, c + 3) : null;
        tl.to(`${row} .tint`, { opacity: 1, duration: 0.25, ease: "power2.out" }, c);
        tl.to(`${row} .bar`, { scaleY: 1, duration: 0.3, ease: "power2.out" }, c);
        tl.to(`${row} .rk`, { color: FOCUS, duration: 0.25 }, c);
        tl.to(`#to-rp${n}`, { opacity: 1, duration: 0.12 }, c);
        tl.set(`#to-img${n}`, { opacity: 1 }, c);
        if (i > 0) {
          const prev = `#to-row${i}`;
          tl.to(`${prev} .tint`, { opacity: 0, duration: 0.25 }, c);
          tl.to(`${prev} .bar`, { scaleY: 0, duration: 0.25, ease: "power2.in" }, c);
          tl.to(`${prev} .rk`, { color: MUTED, duration: 0.25 }, c);
          tl.to(`#to-rp${i}`, { opacity: 0, duration: 0.12 }, c);
          tl.set(`#to-img${i}`, { opacity: 0 }, c);
        }
        // README scrolls slowly through this repo's segment: at most scrollSpeed px/s, never past its bottom
        const segEnd = next != null ? next : c + 4;
        const img = $(`to-img${n}`), p = { v: 0 };
        tl.fromTo(p, { v: 0 }, {
          v: 1, duration: Math.max(0.5, segEnd - c - 0.3), ease: "sine.inOut",
          onUpdate: () => {
            // from the image's own size, not a layout measurement: the panel shows it 1044 px wide
            const room = img.naturalWidth ? Math.max(0, (img.naturalHeight * VIEW_W) / img.naturalWidth - VIEW_H) : 0;
            const dist = Math.min(room, SPEED * (segEnd - c));
            img.style.transform = `translateY(${(-dist * p.v).toFixed(1)}px)`;
          },
        }, c + 0.3);
        // Star → Starred
        tl.to(`${row} .s0`, { opacity: 0, duration: 0.1 }, c + 0.45);
        tl.fromTo(`${row} .s1`, { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(3)" }, c + 0.45);
        tl.fromTo(`${row} .wk`, { scale: 1 }, { scale: 1.06, duration: 0.125, ease: "power2.out", yoyo: true, repeat: 1 }, c + 0.55);
        // the README frame flashes the focus colour when it switches
        tl.fromTo("#to-readme", { borderColor: FOCUS }, { borderColor: BORDER, duration: 0.6, ease: "power2.in" }, c);
      });

      window.__timelines["trending-overview"] = tl;
    })();
  </script>
</template>
