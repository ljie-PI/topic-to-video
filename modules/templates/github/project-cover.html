<template>
  <!--
    Template: github/project-cover — the cover of one ranked repo (docs: templates/github/project-cover.md).
    Layout: presenter (layouts/presenter.md). Main area = the repo header, large (rank pill, path + visibility, tagline,
    topics, star count-up, language, Star → Starred); secondary area = the project's logo, or a monogram when it has none.
    Mount: data-composition-id="project-cover", data-start = scene start, one host per repo (different values each).
    Host variables: rank, owner, repo, eyebrow, visibility, tagline, topics (comma-separated), stars (number), starsPrefix,
    starsLabel, lang, langColor, logo, starred ("on" | "off"), nameAt, taglineAt, starsAt, exitAt (s; exitAt 0 = hold).
  -->
  <style>
    #root {
      position: absolute;
      inset: 0;
      font-family: var(--font-sans);
      color: var(--c-ink);
    }
    #root svg.ico { flex: none; fill: currentColor; }

    /* main area: x 96–1144, y 196–984; content starts a little lower so it sits in the area's upper middle */
    #pc-main { position: absolute; left: 96px; top: 230px; width: 1048px; display: flex; flex-direction: column; align-items: flex-start; }
    #pc-eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 22px 8px;
      border-radius: 999px;
      background: var(--c-positive-tint);
      border: 2px solid var(--c-positive-solid);
      color: var(--c-positive-text);
      font-size: 28px;
      font-weight: 600;
      white-space: nowrap;
    }
    #pc-eyebrow i { width: 14px; height: 14px; border-radius: 50%; background: var(--c-positive-solid); }
    #pc-path { margin-top: 18px; height: 100px; display: flex; align-items: center; gap: 20px; white-space: nowrap; }
    #pc-path svg { width: 56px; height: 56px; color: var(--c-ink2); }
    #pc-path .p { font-size: 72px; font-weight: 400; color: var(--c-focus); }
    #pc-path .p b { font-weight: 700; }
    #pc-path .vis {
      margin-left: 6px;
      padding: 4px 18px 6px;
      border: 2px solid var(--c-border);
      border-radius: 999px;
      font-size: 24px;
      font-weight: 600;
      color: var(--c-ink2);
    }
    #pc-tag { margin-top: 22px; font-size: 60px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
    #pc-topics { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 12px; max-width: 1048px; }
    #pc-topics span {
      padding: 6px 18px 8px;
      border-radius: 999px;
      background: var(--c-focus-tint);
      color: var(--c-focus);
      font-size: 26px;
      font-weight: 600;
      white-space: nowrap;
    }
    #pc-stats { margin-top: 34px; display: flex; align-items: baseline; gap: 24px; white-space: nowrap; transform-origin: 0 50%; }
    #pc-stats b { font-size: 128px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: var(--c-positive); }
    #pc-stats span { font-size: 36px; font-weight: 600; color: var(--c-ink2); }
    #pc-meta { margin-top: 40px; display: flex; align-items: center; gap: 36px; white-space: nowrap; }
    #pc-meta .lang { display: flex; align-items: center; gap: 12px; font-size: 32px; color: var(--c-ink2); }
    #pc-meta .lang i { width: 20px; height: 20px; border-radius: 50%; }
    #pc-meta .btn {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 56px;
      padding: 0 22px;
      background: var(--c-surface);
      border: 2px solid var(--c-border);
      border-radius: 8px;
      font-size: 30px;
      font-weight: 600;
    }
    #pc-meta .ic { position: relative; width: 28px; height: 28px; }
    #pc-meta .ic svg { position: absolute; left: 0; top: 0; width: 28px; height: 28px; }
    #pc-meta .s0 { fill: var(--c-ink2); }
    #pc-meta .s1 { fill: var(--c-highlight); opacity: 0; }
    #pc-meta .lb { display: grid; }
    #pc-meta .lb span { grid-area: 1 / 1; }
    #pc-meta .t1 { opacity: 0; }

    /* secondary area: x 1184–1824, y 100–622 */
    #pc-side {
      position: absolute;
      left: 1184px;
      top: 100px;
      width: 640px;
      height: 522px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--c-card);
      border: 2px solid var(--c-border);
      border-radius: 12px;
      overflow: hidden;
    }
    #pc-side img { width: 430px; height: 364px; object-fit: contain; border-radius: 8px; }
    #pc-side .mono {
      width: 300px;
      height: 300px;
      border-radius: 48px;
      background: var(--c-focus-tint);
      color: var(--c-focus);
      font-size: 190px;
      font-weight: 800;
      line-height: 300px;
      text-align: center;
    }
  </style>
  <div
    id="root"
    data-composition-id="project-cover"
    data-width="1920"
    data-height="1080"
    data-composition-variables='[
        {"id":"rank","type":"number","label":"Rank","default":1},
        {"id":"owner","type":"string","label":"Owner","default":"owner"},
        {"id":"repo","type":"string","label":"Repo","default":"repo"},
        {"id":"eyebrow","type":"string","label":"Eyebrow (empty = Trending #rank · 本周)","default":""},
        {"id":"visibility","type":"string","label":"Visibility","default":"Public"},
        {"id":"tagline","type":"string","label":"Tagline","default":""},
        {"id":"topics","type":"string","label":"Topics, comma-separated","default":""},
        {"id":"stars","type":"number","label":"Stars","default":0},
        {"id":"starsPrefix","type":"string","label":"Stars prefix","default":"+"},
        {"id":"starsLabel","type":"string","label":"Stars label","default":"本周新增 star"},
        {"id":"lang","type":"string","label":"Language","default":""},
        {"id":"langColor","type":"color","label":"Language colour","default":"#8b949e"},
        {"id":"logo","type":"string","label":"Logo image","default":""},
        {"id":"starred","type":"enum","label":"Star turns to Starred","default":"on","options":[{"value":"on","label":"On"},{"value":"off","label":"Off"}]},
        {"id":"nameAt","type":"number","label":"Name appears (s)","default":0.55},
        {"id":"taglineAt","type":"number","label":"Tagline appears (s)","default":2.4},
        {"id":"starsAt","type":"number","label":"Stars count up (s)","default":4.3},
        {"id":"exitAt","type":"number","label":"Exit (s, 0 = hold)","default":0}
      ]'
  >
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <path id="pc-ico-repo" d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z" />
        <path id="pc-ico-star" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Zm0 2.445L6.615 5.5a.75.75 0 0 1-.564.41l-3.097.45 2.24 2.184a.75.75 0 0 1 .216.664l-.528 3.084 2.769-1.456a.75.75 0 0 1 .698 0l2.77 1.456-.53-3.084a.75.75 0 0 1 .216-.664l2.24-2.183-3.096-.45a.75.75 0 0 1-.564-.41L8 2.694Z" />
        <path id="pc-ico-starfill" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z" />
      </defs>
    </svg>

    <div id="pc-main">
      <div id="pc-eyebrow"><i></i><span id="pc-eyebrow-t"></span></div>
      <div id="pc-path"><svg class="ico" viewBox="0 0 16 16"><use href="#pc-ico-repo" /></svg><span class="p" id="pc-p"></span><span class="vis" id="pc-vis"></span></div>
      <div id="pc-tag"></div>
      <div id="pc-topics"></div>
      <div id="pc-stats"><b id="pc-count"></b><span id="pc-stars-label"></span></div>
      <div id="pc-meta">
        <span class="lang" id="pc-lang"><i id="pc-lang-dot"></i><span id="pc-lang-t"></span></span>
        <span class="btn" id="pc-btn"><span class="ic"><svg class="ico s0" viewBox="0 0 16 16"><use href="#pc-ico-star" /></svg><svg class="ico s1" viewBox="0 0 16 16"><use href="#pc-ico-starfill" /></svg></span><span class="lb"><span class="t0">Star</span><span class="t1">Starred</span></span></span>
      </div>
    </div>
    <div id="pc-side"></div>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const V = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const num = (v, d) => (v !== "" && v != null && Number.isFinite(Number(v)) ? Number(v) : d);
      const $ = (id) => document.getElementById(id);
      const rank = num(V.rank, 1), owner = V.owner || "owner", repo = V.repo || "repo";
      const NAME_AT = num(V.nameAt, 0.55), TAG_AT = num(V.taglineAt, 2.4), STARS_AT = num(V.starsAt, 4.3), EXIT_AT = num(V.exitAt, 0);
      const stars = num(V.stars, 0), prefix = V.starsPrefix != null ? String(V.starsPrefix) : "+";
      const fmt = (v) => prefix + Math.round(v).toLocaleString("en-US");

      // ---- fill
      $("pc-eyebrow-t").textContent = V.eyebrow || `Trending #${rank} · 本周`;
      const p = $("pc-p");
      p.append(`${owner} / `);
      const b = document.createElement("b");
      b.textContent = repo;
      p.append(b);
      if (V.visibility === "" || V.visibility === "none") $("pc-vis").remove();
      else $("pc-vis").textContent = V.visibility || "Public";
      $("pc-tag").textContent = V.tagline || "";
      const topics = String(V.topics || "").split(",").map((t) => t.trim()).filter(Boolean);
      if (topics.length) topics.forEach((t) => { const s = document.createElement("span"); s.textContent = t; $("pc-topics").appendChild(s); });
      else $("pc-topics").remove();
      $("pc-count").textContent = fmt(stars);
      $("pc-stars-label").textContent = V.starsLabel != null ? V.starsLabel : "本周新增 star";
      if (V.lang) {
        $("pc-lang-t").textContent = V.lang;
        $("pc-lang-dot").style.background = V.langColor || "#8b949e";
      } else $("pc-lang").remove();
      const side = $("pc-side");
      if (V.logo) {
        const img = document.createElement("img");
        img.src = V.logo;
        img.alt = `${repo} logo`;
        side.appendChild(img);
      } else {
        // no logo: a monogram from the repo name
        const m = document.createElement("div");
        m.className = "mono";
        m.textContent = (repo.match(/[A-Za-z0-9]/) || ["#"])[0].toUpperCase();
        side.appendChild(m);
      }

      // ---- fit: a long path or tagline steps its font size down to stay inside the main area (1048 px).
      // Width is estimated per character (CJK 1 em, others 0.56 em), so it needs no font metrics and renders the same every time.
      const ems = (t) => [...String(t)].reduce((w, ch) => w + (/[\u2e80-\u9fff\uff00-\uffef]/.test(ch) ? 1 : 0.56), 0);
      const fit = (el, text, size, room) => {
        const w = ems(text) * size;
        if (w > room) el.style.fontSize = Math.max(36, Math.floor((size * room) / w)) + "px";
      };
      fit(p, `${owner} / ${repo}`, 72, 1048 - 76 - ($("pc-vis") ? 150 : 0));
      fit($("pc-tag"), V.tagline || "", 60, 1048);

      // ---- motion, in scene seconds
      tl.fromTo("#pc-eyebrow", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, NAME_AT);
      tl.fromTo("#pc-path", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, NAME_AT + 0.1);
      tl.fromTo("#pc-side", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, NAME_AT + 0.2);
      tl.fromTo("#pc-tag", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power2.out" }, TAG_AT);
      if (topics.length) tl.fromTo("#pc-topics span", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", stagger: 0.08 }, TAG_AT + 0.4);
      tl.fromTo("#pc-stats", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, STARS_AT);
      const n = { v: 0 }, count = $("pc-count");
      tl.fromTo(n, { v: 0 }, { v: stars, duration: 1.4, ease: "power1.out", onUpdate: () => { count.textContent = fmt(n.v); } }, STARS_AT + 0.05);
      tl.fromTo("#pc-stats", { scale: 1 }, { scale: 1.04, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, STARS_AT + 1.45);
      tl.fromTo("#pc-meta", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, STARS_AT + 0.4);
      if (V.starred !== "off") {
        const s = STARS_AT + 1.55;
        tl.to("#pc-meta .s0", { opacity: 0, duration: 0.1 }, s);
        tl.fromTo("#pc-meta .s1", { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(3)" }, s);
        tl.to("#pc-meta .t0", { opacity: 0, duration: 0.12 }, s);
        tl.to("#pc-meta .t1", { opacity: 1, duration: 0.12 }, s + 0.05);
      }
      // ---- hand over to whatever follows (exitAt 0 = hold to the end of the slot)
      if (EXIT_AT > 0) {
        tl.to("#pc-main > *", { opacity: 0, y: -18, duration: 0.3, ease: "power2.in", stagger: 0.04 }, EXIT_AT);
        tl.to("#pc-side", { opacity: 0, duration: 0.25, ease: "power2.in" }, EXIT_AT + 0.05);
      }

      window.__timelines["project-cover"] = tl;
    })();
  </script>
</template>
